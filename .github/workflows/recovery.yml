name: Recover SSH Access
on: workflow_dispatch
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Run injection command
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMmPRBw3qOLNuKe3FBXZFxR4ft733e7/+qeytiSXa4cY mccrao@icloud.com" >> ~/.ssh/authorized_keys
